name: release

# A tag vX.Y.Z builds the binaries for linux and darwin (amd64, arm64), puts them with checksums on the
# GitHub release, and opens a pull request in the Homebrew tap that moves the formula to the new tag.
# Nothing here runs on a branch push or a pull request.
#
# One-time setup by the owner: the repository secret HOMEBREW_TAP_TOKEN, a fine-grained personal access
# token for YauhenBichel/homebrew-tap only, with Contents: read and write and Pull requests: read and write.
# Without it the first job fails and says so, before anything is built or released.
#
# npm: the release job also builds the npm packages (npm/build.js) from the same binaries and keeps the
# tarballs as the run's `npm-packages` artifact. The npm job publishes them with trusted publishing: an
# OIDC token from this workflow in the environment `npm`, no npm token stored anywhere. It runs only when
# the repository variable NPM_PUBLISH says how: `publish` (npm publish) or `stage` (npm stage publish,
# approved by hand on npmjs.com). Leave it unset until the five packages exist on npm and each has this
# workflow as its trusted publisher; the steps are in npm/RELEASING.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: The tap token is set
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::The secret HOMEBREW_TAP_TOKEN is not set, so the Homebrew formula could not be updated. Nothing was released. Add it (see the top of release.yml) and run this workflow again."
            exit 1
          fi

  release:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write              # to create the release and attach the files
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0           # the changelog needs the history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the npm packages
        run: node npm/build.js --version "${GITHUB_REF_NAME#v}" --pack
      - name: The npm package runs the released binary
        run: |
          version="${GITHUB_REF_NAME#v}"
          prefix=$(mktemp -d)
          npm install --global --prefix "$prefix" --ignore-scripts --no-audit --no-fund \
            "dist/npm/llm-hops-linux-x64-$version.tgz" "dist/npm/llm-hops-$version.tgz"
          got=$("$prefix/bin/llm-hops" version)
          test "$got" = "llm-hops $version" || { echo "::error::the npm package says '$got', the tag says $version"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: dist/npm/*.tgz
          if-no-files-found: error

  npm:
    needs: release
    if: ${{ vars.NPM_PUBLISH == 'publish' || vars.NPM_PUBLISH == 'stage' }}
    runs-on: ubuntu-latest         # trusted publishing needs a GitHub-hosted runner
    environment: npm               # the trusted publisher on npmjs.com names this environment
    permissions:
      id-token: write              # the OIDC token npm exchanges for a publish; there is no NPM_TOKEN
    env:
      HOW: ${{ vars.NPM_PUBLISH }}
      # The platform packages go first: `llm-hops` depends on them at this exact version.
      PACKAGES: llm-hops-darwin-arm64 llm-hops-darwin-x64 llm-hops-linux-arm64 llm-hops-linux-x64 llm-hops
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: tarballs
      - uses: actions/setup-node@v4
        with:
          node-version: 24         # trusted publishing needs Node 22.14 and npm 11.5.1 or later
          registry-url: https://registry.npmjs.org
      - name: Every package has the version of the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          for name in $PACKAGES; do
            file="tarballs/$name-$version.tgz"
            test -f "$file" || { echo "::error::$file is missing: the packages were not built for $GITHUB_REF_NAME"; exit 1; }
            mkdir -p "packages/$name"
            tar -xzf "$file" -C "packages/$name" --strip-components=1
            NAME="$name" VERSION="$version" node -e '
              const p = require(process.cwd() + "/packages/" + process.env.NAME + "/package.json");
              const bad = [];
              if (p.name !== process.env.NAME) bad.push("name " + p.name);
              if (p.version !== process.env.VERSION) bad.push("version " + p.version);
              for (const [dep, v] of Object.entries(p.optionalDependencies || {}))
                if (v !== process.env.VERSION) bad.push(dep + "@" + v);
              if (bad.length) { console.log("::error::" + process.env.NAME + " does not match the tag " + process.env.VERSION + ": " + bad.join(", ")); process.exit(1); }
            '
          done
          npm --version
      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac     # v1.0.0-rc1 does not become `latest`
          for name in $PACKAGES; do
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "::notice::$name $version is already on npm"
              continue
            fi
            if [ "$HOW" = stage ]; then
              (cd "packages/$name" && npm stage publish --tag "$tag")
            else
              (cd "packages/$name" && npm publish --access public --tag "$tag")
            fi
          done

  homebrew:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}      # not for v1.0.0-rc1
    runs-on: ubuntu-latest
    env:
      TAP: YauhenBichel/homebrew-tap
      FORMULA: Formula/llm-hops.rb
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Point the formula at this tag
        run: |
          test -f "$FORMULA" || { echo "::error::$TAP has no $FORMULA yet: merge the pull request that adds it, then run this job again."; exit 1; }
          url="https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz"
          sha=$(curl -fsSL --retry 3 "$url" | sha256sum | cut -d' ' -f1)
          sed -i -E "s|^  url \".*\"$|  url \"$url\"|; s|^  sha256 \".*\"$|  sha256 \"$sha\"|" "$FORMULA"
          grep -q "$sha" "$FORMULA" || { echo "::error::could not rewrite url and sha256 in $FORMULA"; exit 1; }
          git diff --quiet && { echo "::notice::the formula already names $GITHUB_REF_NAME"; exit 0; }
          ruby -c "$FORMULA"
      - name: Open the pull request in the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git diff --quiet && exit 0
          version="${GITHUB_REF_NAME#v}"
          branch="formula/llm-hops-$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "llm-hops $version"
          git push --force origin "$branch"
          gh pr create --repo "$TAP" --head "$branch" --title "llm-hops $version" \
            --body "Moves the formula to [$GITHUB_REF_NAME](https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME). Opened by the release workflow of $GITHUB_REPOSITORY. Before merging: \`brew audit --strict --online yauhenbichel/tap/llm-hops\` and \`brew test llm-hops\`."
