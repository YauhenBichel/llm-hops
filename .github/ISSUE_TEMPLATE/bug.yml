name: Bug
description: llm-hops did something wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: llm-hops version and operating system
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove hostnames, prompts, tokens and anything private first.
      render: text
