[project]
name = "llm-hops"
version = "0.1.0"
description = "Python SDK for llm-hops: open spans in your LLM service and post them to a llm-hops server; an ASGI middleware for one span per request."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Yauhen Bichel" }]
keywords = ["llm", "observability", "tracing", "asgi", "fastapi", "openai-compatible"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6", "starlette>=0.38", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/YauhenBichel/llm-hops"
Issues = "https://github.com/YauhenBichel/llm-hops/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_hops"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["llm_hops", "tests"]

[[tool.mypy.overrides]]
module = ["starlette.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
